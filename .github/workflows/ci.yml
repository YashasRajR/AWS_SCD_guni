name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR cancels any in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # Fast, dependency-free gate: every push/PR gets this without waiting on
  # a database. Runs first so a broken build/lint fails quickly.
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build (all workspaces)
        run: npm run build

      - name: Dependency audit (informational)
        # Not a merge-blocking gate yet: known findings from an earlier
        # audit haven't all been resolved, so failing the build on them
        # now would just block unrelated PRs. Tighten to a hard gate
        # (drop continue-on-error) once `npm audit fix` has been applied
        # and verified. Still runs and reports on every push/PR so new
        # vulnerabilities are visible instead of silent.
        run: npm audit --audit-level=high
        continue-on-error: true

  # DB-free unit tests (mocked repositories) — no Postgres service needed,
  # so this stays fast and can run even if the integration job is skipped.
  unit-tests:
    name: Unit tests (backend, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run backend unit tests
        run: npm run test:unit --workspace=backend

  # DB-backed integration/API tests — spins up a real Postgres service
  # container, then vitest's globalSetup (tests/fixtures/global-setup.ts)
  # migrates + seeds it before the suite runs.
  integration-tests:
    name: Integration tests (backend, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scd_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run backend test suite (migrate + seed + integration/API tests)
        run: npm run test --workspace=backend

  # Browser E2E smoke tests (Playwright) -- boots a real backend against a
  # seeded Postgres, plus all three Vite dev servers, and drives each app's
  # login + one critical flow through a real browser.
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scd_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scd_e2e
      AUTH_SECRET: e2e-test-secret-do-not-use-in-production
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Migrate + seed the database
        run: npm run db:migrate && npm run db:seed

      - name: Start backend
        run: npm run dev --workspace=backend &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time" >&2
          exit 1

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
