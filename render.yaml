services:
  # Static Site: AWS Student Community Day Attendee Web App
  - type: web
    name: scd-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=@scd/app-web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://scd-backend.onrender.com/api/v1

  # Static Site: Admin Portal
  - type: web
    name: scd-admin
    runtime: static
    buildCommand: npm install && npm run build --workspace=@scd/app-admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://scd-backend.onrender.com/api/v1

  # Web Service: Backend API (Node.js / Express)
  - type: web
    name: scd-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=backend
    startCommand: npm run db:migrate && npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_SSL
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://scd-web.onrender.com
      - key: ADMIN_APP_URL
        value: https://scd-admin.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: scd-db
          property: connectionString

databases:
  # Managed PostgreSQL Database for Backend
  - name: scd-db
    databaseName: scd
    user: scd_user
    plan: free
