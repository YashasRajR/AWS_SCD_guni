services:
  # Static Site: AWS Student Community Day Attendee Web App
  - type: static
    name: scd-web
    buildCommand: npm install && npm run build --workspace=@scd/app-web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # Static Site: Admin Portal
  - type: static
    name: scd-admin
    buildCommand: npm install && npm run build --workspace=@scd/app-admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # Web Service: Backend API (Node.js / Express)
  - type: web
    name: scd-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=backend
    # Migrations are idempotent (tracked in schema_migrations) and safe to
    # run on every start. db:seed is NOT run here -- it upserts demo/sample
    # content and would overwrite real admin-edited data on every
    # restart/redeploy. This is a fresh, empty Render Postgres database, so
    # run "npm run db:seed" manually once (Render Shell) after the first
    # successful deploy to load the initial event/ticket content.
    startCommand: npm run db:migrate && npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_SSL
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://scd-web.onrender.com
      - key: ADMIN_APP_URL
        value: https://scd-admin.onrender.com
      # Render-managed Postgres, provisioned by the databases: block below.
      - key: DATABASE_URL
        fromDatabase:
          name: scd-db
          property: connectionString

databases:
  - name: scd-db
    plan: free
    databaseName: scd
    user: scd
